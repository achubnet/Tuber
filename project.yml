name: Tuber
options:
  deploymentTarget:
    iOS: "26.1"
  developmentLanguage: en
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.2.0"
targets:
  Tuber:
    type: application
    platform: iOS
    sources: [Tuber]
    dependencies:
      - package: YouTubeKit
      - target: TuberShare
    entitlements:
      path: Tuber/Resources/Tuber.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).tuber]
        com.apple.developer.icloud-container-identifiers: [iCloud.$(BUNDLE_PREFIX).tuber]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).tuber
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tuber
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Tuber/Resources/Info.plist
      properties:
        UIBackgroundModes: [audio, remote-notification]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tuber]
        CFBundleDisplayName: Tuber
        UILaunchScreen: {}
        CFBundleLocalizations: [en, ru]
        TuberAppGroup: group.$(BUNDLE_PREFIX).tuber
        TuberCloudContainer: iCloud.$(BUNDLE_PREFIX).tuber
  TuberShare:
    type: app-extension
    platform: iOS
    sources:
      - TuberShare
      - Tuber/Logic/VideoLink.swift
    entitlements:
      path: TuberShare/TuberShare.entitlements
      properties:
        com.apple.security.application-groups: [group.$(BUNDLE_PREFIX).tuber]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).tuber.share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Tuber
    info:
      path: TuberShare/Info.plist
      properties:
        CFBundleDisplayName: Tuber
        TuberAppGroup: group.$(BUNDLE_PREFIX).tuber
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  TuberTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TuberTests]
    dependencies:
      - target: Tuber
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tuber.app/Tuber
schemes:
  Tuber:
    build:
      targets:
        Tuber: all
        TuberTests: [test]
    test:
      targets: [TuberTests]
